<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calibrar colores</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f4f4f4; color: #222; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  .ahora { display: flex; gap: 16px; align-items: center; background: #fff; border-radius: 12px; padding: 16px; }
  #muestra { width: 90px; height: 90px; border-radius: 12px; border: 2px solid #ccc; }
  #color { font-size: 36px; font-weight: 700; }
  #nums { font-family: monospace; color: #555; }
  p { margin: 16px 0 8px; }
  .botones { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  button { font-size: 18px; padding: 16px 8px; border: 0; border-radius: 12px; color: #fff; cursor: pointer; }
  button small { display: block; font-size: 12px; opacity: .85; font-family: monospace; }
  .paso { background: #fff; border-radius: 12px; padding: 16px; margin-top: 16px; font-size: 20px; }
  .paso #pasoBtn { width: 100%; font-size: 24px; margin: 12px 0; }
  .nav { display: flex; gap: 10px; }
  .nav button { flex: 1; background: #888; font-size: 16px; padding: 10px; }
  #msg { margin-top: 12px; font-weight: 600; color: #0a7a2f; min-height: 1.2em; }
</style>
</head>
<body>
<h1>Calibrar colores</h1>
<div class="ahora">
  <div id="muestra"></div>
  <div>
    <div>El robot ve:</div>
    <div id="color">...</div>
    <div id="nums"></div>
  </div>
</div>
<div class="paso">
  <button id="tofBtn" style="background:#37474f;width:100%" onclick="verTof()">Ver sensores ToF</button>
  <div id="tofPanel" style="display:none;margin-top:12px">
    <svg id="tofSvg" viewBox="-200 -230 400 330" style="width:100%;max-width:420px;display:block;margin:auto;background:#111;border-radius:10px">
      <rect x="-60" y="-60" width="120" height="120" rx="28" fill="#ffb300"/>
      <text x="0" y="8" text-anchor="middle" font-size="22" fill="#111">robot</text>
      <line id="lF" x1="0" y1="-54" x2="0" y2="-54" stroke-width="10"/>
      <line id="lI" x1="-43" y1="-40" x2="-43" y2="-40" stroke-width="10"/>
      <line id="lD" x1="43" y1="-40" x2="43" y2="-40" stroke-width="10"/>
      <text id="tF" x="12" y="-200" font-size="20" fill="#fff"></text>
      <text id="tI" x="-195" y="-50" font-size="20" fill="#fff"></text>
      <text id="tD" x="195" y="-50" font-size="20" fill="#fff" text-anchor="end"></text>
    </svg>
    <div id="tofTxt" style="font-family:monospace;font-size:15px;margin-top:8px;white-space:pre-line"></div>
  </div>
</div>
<div class="paso">
  <div><b>Dónde está</b> (odometría)</div>
  <div id="odo" style="font-family:monospace;font-size:15px;margin-top:6px;white-space:pre-line">...</div>
</div>
<div class="paso">
  <div>Modo de exploración: <b id="modo">...</b></div>
  <div class="nav" style="margin-top:8px">
    <button style="background:#1565c0" onclick="ponModo('mapa')">Mapa (inteligente)</button>
    <button style="background:#6d4c41" onclick="ponModo('tonto')">Tonto (pared derecha)</button>
  </div>
</div>
<div class="paso">
  <div>Cámara (rojo = ve pared, verde = libre):</div>
  <img id="cam" alt="sin cámara" style="width:100%;max-width:320px;image-rendering:pixelated;background:#000;border-radius:8px;margin-top:8px">
</div>
<div class="paso">
  <div id="pasoTxt"></div>
  <button id="pasoBtn" onclick="pasoGuardar()"></button>
  <div class="nav"><button onclick="ir(-1)">◀ Atrás</button><button onclick="ir(1)">Saltar ▶</button></div>
</div>
<p>O guarda uno suelto:</p>
<div class="botones" id="botones"></div>
<div id="msg"></div>
<script>
const fondo = { PISO: "#777", ROJO: "#c62828", VERDE: "#2e7d32", AZUL: "#1565c0", AMAR: "#c79100" };
let hechos = false, paso = 0, nombres = [];

function verPaso() {
  const t = document.getElementById("pasoTxt"), b = document.getElementById("pasoBtn");
  if (!nombres.length) return;
  if (paso >= nombres.length) {
    t.innerHTML = "<b>¡Listo!</b> Pasa el sensor por cada color y revisa que arriba diga el nombre correcto. Si uno falla, dale Atrás y repítelo.";
    b.style.display = "none";
    return;
  }
  const n = nombres[paso];
  t.innerHTML = `<b>Paso ${paso + 1} de ${nombres.length}:</b> pon el robot con el sensor encima del <b>${n}</b>, quieto, y aprieta el botón.`;
  b.style.display = "";
  b.style.background = fondo[n] || "#555";
  b.textContent = "Guardar " + n;
}

function ir(d) { paso = Math.max(0, Math.min(nombres.length, paso + d)); verPaso(); }

async function pasoGuardar() { await guardar(paso, nombres[paso]); ir(1); }

function pinta(d) {
  const [r, g, b, c] = d.v;
  const k = 255 / Math.max(r, g, b, 0.01);
  document.getElementById("muestra").style.background = `rgb(${r * k},${g * k},${b * k})`;
  document.getElementById("color").textContent = d.color;
  if (d.modo) document.getElementById("modo").textContent = d.modo;
  if (d.odo) {
    const o = d.odo, p = o.paredes || 0, si = (b) => (p & b ? "pared" : "libre");
    const mm = (x) => (x === null || x === undefined ? "—" : Math.round(x) + " mm");
    document.getElementById("odo").textContent =
      (p & 8 ? "Avanzando, faltan " + mm(o.falta) : "Quieto") + "\n" +
      "Sensores: izq " + si(1) + " · frente " + si(2) + " (" + mm(o.frente > 2000 ? null : o.frente) + ") · der " + si(4) + "\n" +
      "Cámara: pared a " + mm(o.cam_mm) + (o.cam_err === null || o.cam_err === undefined ? "" : ", le faltan " + mm(o.cam_err)) + "\n" +
      "Último avance: " + (o.corr || 0) + " correcciones, última " + mm(o.ult) + ", cámara " + mm(o.extra);
  }
  document.getElementById("nums").textContent = `r ${r.toFixed(2)}  g ${g.toFixed(2)}  b ${b.toFixed(2)}  c ${c}`;
  const cont = document.getElementById("botones");
  if (!hechos) {
    d.colores.forEach((n, i) => {
      const bt = document.createElement("button");
      bt.style.background = fondo[n] || "#555";
      bt.onclick = () => guardar(i, n);
      cont.appendChild(bt);
    });
    hechos = true;
    nombres = d.colores;
    verPaso();
  }
  d.colores.forEach((n, i) => {
    const f = d.refs[i];
    cont.children[i].innerHTML = `Es ${n}<small>${f[0]} ${f[1]} ${f[2]} ${f[3]}</small>`;
  });
}

async function guardar(i, n) {
  document.getElementById("msg").textContent = "Guardando " + n + "...";
  const d = await (await fetch("/api/guardar?i=" + i)).json();
  pinta(d);
  document.getElementById("msg").textContent = n + " guardado ✔";
}

async function ponModo(m) {
  const d = await (await fetch("/api/modo?m=" + m)).json();
  document.getElementById("modo").textContent = d.modo;
}

let tofOn = false;
function verTof() {
  tofOn = !tofOn;
  document.getElementById("tofPanel").style.display = tofOn ? "" : "none";
  document.getElementById("tofBtn").textContent = tofOn ? "Ocultar sensores ToF" : "Ver sensores ToF";
  if (tofOn) tof();
}

function rayo(id, x0, y0, dx, dy, mm, pared) {
  const largo = Math.min(mm, 400) / 2.5;          // 400 mm = 160 px
  const l = document.getElementById(id);
  l.setAttribute("x2", x0 + dx * largo);
  l.setAttribute("y2", y0 + dy * largo);
  l.setAttribute("stroke", mm >= 2000 ? "#555" : mm < pared ? "#e53935" : "#43a047");
}

async function tof() {
  if (!tofOn) return;
  try {
    const d = await (await fetch("/api/tof")).json();
    const t = (mm) => (mm >= 2000 ? "nada" : mm + " mm");
    rayo("lF", 0, -54, 0, -1, d.frente, d.pared_f || d.pared);
    rayo("lI", -43, -40, -1, 0, d.izq, d.pared);
    rayo("lD", 43, -40, 1, 0, d.der, d.pared);
    document.getElementById("tF").textContent = t(d.frente);
    document.getElementById("tI").textContent = t(d.izq);
    document.getElementById("tD").textContent = t(d.der);
    document.getElementById("tofTxt").textContent =
      "Rojo = pared (lados < " + d.pared + " mm, frente < " + (d.pared_f || d.pared) + " mm), verde = libre, gris = no ve nada\n" +
      "Celdas libres al frente: " + (d.libres >= 99 ? "muchas" : d.libres) +
      (d.mueve ? "\nAvanzando, faltan " + d.falta + " mm" : "");
  } catch (e) {}
  setTimeout(tof, 150);
}

async function ciclo() {
  try { pinta(await (await fetch("/api/lectura")).json()); } catch (e) {}
  setTimeout(ciclo, 300);
}
ciclo();

async function camara() {
  try {
    const d = await (await fetch("/api/foto")).json();
    if (d.img) document.getElementById("cam").src = "data:image/jpeg;base64," + d.img;
  } catch (e) {}
  setTimeout(camara, 500);
}
camara();
</script>
</body>
</html>
